name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    name: Tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Run checks
        run: ./gradlew --no-daemon :nga-sdk:check :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nagi-debug
          path: app/build/outputs/apk/debug/app-*-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-reports
          path: |
            app/build/reports/
            nga-sdk/build/reports/
          retention-days: 7

  release:
    name: Signed APK and GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-disabled: true
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build signed APK
        env:
          NAGI_SIGNING_STORE_BASE64: ${{ secrets.NAGI_SIGNING_STORE_BASE64 }}
          NAGI_SIGNING_STORE_FILE: ${{ runner.temp }}/nagi-release.jks
          NAGI_SIGNING_STORE_PASSWORD: ${{ secrets.NAGI_SIGNING_STORE_PASSWORD }}
          NAGI_SIGNING_KEY_ALIAS: ${{ secrets.NAGI_SIGNING_KEY_ALIAS }}
          NAGI_SIGNING_KEY_PASSWORD: ${{ secrets.NAGI_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${NAGI_SIGNING_STORE_BASE64:?Set the release signing Secrets first}"
          umask 077
          printf '%s' "$NAGI_SIGNING_STORE_BASE64" | base64 --decode > "$NAGI_SIGNING_STORE_FILE"
          ./gradlew --no-daemon :app:assembleRelease
      - name: Verify and package APK
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil
          import zipfile
          from pathlib import Path

          output = Path('app/build/outputs/apk/release')
          metadata = json.loads((output / 'output-metadata.json').read_text())
          expected = {'arm64-v8a', 'armeabi-v7a', 'x86_64'}
          elements = metadata['elements']
          assert len(elements) == len(expected), 'Expected three ABI-specific APKs'
          seen = set()
          for element in elements:
              assert f"v{element['versionName']}" == os.environ['TAG'], 'Tag must match versionName'
              filters = element['filters']
              assert len(filters) == 1 and filters[0]['filterType'] == 'ABI', 'Expected one ABI filter'
              abi = filters[0]['value']
              assert abi in expected and abi not in seen, f'Unexpected or duplicate ABI: {abi}'
              seen.add(abi)
              with zipfile.ZipFile(output / element['outputFile']) as apk:
                  native_abis = {name.split('/')[1] for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')}
              assert native_abis == {abi}, f'Native libraries do not match {abi}: {native_abis}'
          assert seen == expected, 'Missing ABI'
          Path('dist').mkdir(exist_ok=True)
          for element in elements:
              abi = element['filters'][0]['value']
              shutil.copyfile(output / element['outputFile'], f"dist/nagi-{os.environ['TAG']}-{abi}.apk")
          PY
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          done
          cd dist
          sha256sum ./*.apk > SHA256SUMS
      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nagi-release.jks"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS \
            --verify-tag --title "Nagi ${TAG}" \
            --notes-file .github/release-notes.md

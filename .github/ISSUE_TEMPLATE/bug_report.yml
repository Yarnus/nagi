name: 问题反馈
description: 报告 Nagi 的错误或异常行为。
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue，避免重复反馈。
        请勿上传 Cookie、Token、账号凭据或私信内容，截图请先脱敏。
        环境信息可能由 App 预填，提交前可以检查和修改。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请简要描述遇到的问题。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App 版本
      placeholder: 例如 0.1.4
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android 版本
      placeholder: 例如 16
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备型号
      placeholder: 例如 Google Pixel 9
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或补充说明（可选）
      description: 可以粘贴脱敏后的截图，请勿包含凭据或私信内容。
